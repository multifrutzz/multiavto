name: multiavto

services:
  app:
    build: .
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/multiavto.db}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Создайте .env по образцу .env.example}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
  caddy_config: